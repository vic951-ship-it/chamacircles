<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chamacircles - Till 4835569</title><style>body{font-family:sans-serif;background:#fff3e0;margin:0;padding:10px}.header{background:#e65100;color:white;padding:15px;border-radius:12px;text-align:center}.btn{padding:15px;border:none;border-radius:10px;margin:5px;font-weight:bold;cursor:pointer;width:48%}.btn-o{background:#e65100;color:white}.btn-b{background:#1565c0;color:white}.card{background:white;padding:12px;border-radius:10px;margin:8px 0;box-shadow:0 2px 5px rgba(0,0,0,0.1)}input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px}.pay{background:#2e7d32;color:white;padding:15px;border:none;border-radius:10px;width:100%;font-size:16px;font-weight:bold}</style></head><body>
<div class="header"><h2>Chamacircles</h2><p>Till 4835569 - Chama Circles MerryGoRound</p><p>10-20 • 21-30 • Infinite Ranges</p></div>
<div style="text-align:center;margin:15px 0"><button class="btn btn-o" onclick="loadOccupied(0)">🟠 Occupied Ranges<br><small>5 at a time - From DB</small></button><button class="btn btn-b" onclick="loadAvailable(0)">🔵 New Ranges<br><small>10-20,21-30... Infinite</small></button></div>
<div id="list"></div><div id="more" style="text-align:center"></div>
<div id="joinForm" class="card" style="display:none"><h3 id="selRange"></h3><p>Entry = Highest×10 (once) + Maintenance 8×nth</p><input id="name" placeholder="Your Name"><input id="phone" placeholder="Phone 0718370199"><label>Select Amount within range:</label><select id="amount"></select><p><b>Total: KES <span id="totalPay">0</span></b> (Entry <span id="entryFee"></span> + Maint <span id="maint"></span>)</p><button class="pay" onclick="joinAndPay()">Pay via Till 4835569</button><div id="status"></div></div>
<div class="card"><h3>Database - Circles & Beneficiaries</h3><div id="circlesList">Loading...</div></div>
<script>
let curLow,curHigh,curPage=0;
function loadOccupied(p){curPage=p;fetch(`/api/ranges/occupied?page=${p}`).then(r=>r.json()).then(d=>{let h='<h3>Occupied Ranges (5 at a time)</h3>';d.ranges.forEach(c=>{h+=`<div class="card"><b>${c.label}</b> - ${c.members.length}/10 members - Beneficiaries: ${c.beneficiaries.length}<br><button class="btn btn-o" onclick="selectRange(${c.low},${c.high})">Select This Range</button></div>`;});document.getElementById('list').innerHTML=h;document.getElementById('more').innerHTML=(d.hasMore?`<button class="btn btn-o" onclick="loadOccupied(${p+1})">Next 5 ➡️</button>`:'')+(p>0?`<button onclick="loadOccupied(${p-1})">⬅️ Prev</button>`:'');});loadCircles();}
function loadAvailable(p){curPage=p;fetch(`/api/ranges/available?page=${p}`).then(r=>r.json()).then(d=>{let h='<h3>New Ranges - Infinite (5 at a time)</h3>';d.ranges.forEach(rg=>{h+=`<div class="card"><b>${rg.label}</b> - New Circle 0/10<br><button class="btn btn-b" onclick="selectRange(${rg.low},${rg.high})">Join This Range</button></div>`;});document.getElementById('list').innerHTML=h;document.getElementById('more').innerHTML=`<button class="btn btn-b" onclick="loadAvailable(${p+1})">Next 5 Ranges ➡️ Infinite Press</button> ${p>0?`<button onclick="loadAvailable(${p-1})">⬅️ Prev</button>`:''}`;});}
function selectRange(low,high){curLow=low;curHigh=high;document.getElementById('selRange').innerText=`Selected: ${low} to ${high}`;let sel=document.getElementById('amount');sel.innerHTML='';for(let i=low;i<=high;i++){let o=document.createElement('option');o.value=i;o.text=`KES ${i}`;sel.appendChild(o);}let entry=high*10;let maint=8*(curPage+1);document.getElementById('entryFee').innerText=entry;document.getElementById('maint').innerText=maint;document.getElementById('totalPay').innerText=entry+maint;document.getElementById('joinForm').style.display='block';window.scrollTo(0,document.getElementById('joinForm').offsetTop);}
function joinAndPay(){let name=document.getElementById('name').value;let phone=document.getElementById('phone').value;let amount=document.getElementById('amount').value;if(!name||!phone) return alert('Enter name & phone');fetch('/api/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({low:curLow,high:curHigh,name,phone,amount})}).then(r=>r.json()).then(d=>{if(d.error) return alert(d.error);document.getElementById('status').innerHTML=`<p style="background:#c8e6c9;padding:10px;border-radius:8px">✅ Joined Circle ${curLow}-${curHigh} - ${d.circle.members.length}/10<br>Total KES ${d.totalToPay} (Entry ${d.entryFee}+Maint ${d.maintenance})<br>${d.beneficiary?`🎉 Beneficiary: <b>${d.beneficiary.name}</b> - Round ${d.circle.beneficiaries.length}`:'Waiting for 10 members...'}</p>`;fetch('/api/stkpush',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,amount:d.totalToPay})}).then(r=>r.json()).then(s=>{document.getElementById('status').innerHTML+=`<br>✅ STK Push Sent! Check phone PIN popup! ID:${s.CheckoutRequestID}`;});loadCircles();});}
function loadCircles(){fetch('/api/circles').then(r=>r.json()).then(db=>{let h='';db.circles.slice(-10).reverse().forEach(c=>{h+=`<div style="border-bottom:1px solid #eee;padding:6px 0"><b>${c.label}</b> ${c.members.length}/10 - `;c.members.forEach(m=>{h+=`${m.name}(${m.amount})${m.hasBenefited?'🏆':''} `;});if(c.beneficiaries.length>0)h+=`<br>🏆 Beneficiaries: ${c.beneficiaries.map(b=>b.name+' R'+b.round).join(', ')}`;h+='</div>';});document.getElementById('circlesList').innerHTML=h||'No circles yet - Be first!';});}
loadOccupied(0);
</script></body></html>
